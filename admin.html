<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mobile Legends API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin-style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            <span>MLBB Admin</span>
        </div>
        <nav class="menu">
            <a href="#form-section" class="active"><i class="fas fa-plus-circle"></i> Agregar Héroe</a>
            <a href="#heroes-list"><i class="fas fa-list"></i> Lista de Héroes</a>
            <a href="/" target="_blank"><i class="fas fa-code"></i> Ver API</a>
        </nav>
        <div class="sidebar-footer">
            <p>v2.0.0</p>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Panel de Administración</h1>
            <div class="status-badge" id="apiStatus">
                <i class="fas fa-circle"></i> Conectado
            </div>
        </header>

        <div class="content-grid">
            <section class="card form-card" id="form-section">
                <div class="card-header">
                    <h2><i class="fas fa-user-plus"></i> Nuevo Héroe</h2>
                </div>
                <form id="heroForm" class="admin-form">
                    <!-- ✅ NUEVO: Campo ID Oficial -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>ID Oficial (ej. 133 para Hirara)</label>
                            <input type="number" id="heroId" placeholder="Ej: 133" min="1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="heroName" required placeholder="Ej: Miya">
                        </div>
                        <div class="form-group">
                            <label>Win Rate *</label>
                            <input type="text" id="winRate" required placeholder="Ej: 49.5%">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Roles * (separar con coma)</label>
                        <input type="text" id="heroRole" required placeholder="Ej: Tirador,Asesino">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>URL Imagen Principal *</label>
                            <input type="url" id="heroImage" required placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>URL Iconos * (separar con coma)</label>
                            <input type="url" id="iconImage" required placeholder="https://...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>URL Guía</label>
                        <input type="url" id="guideImage" placeholder="https://...">
                    </div>

                    <h3 class="section-title"><i class="fas fa-bolt"></i> Habilidades</h3>
                    <div class="skills-grid">
                        <div class="skill-box">
                            <h4>Habilidad 1</h4>
                            <input type="text" id="skill1Name" required placeholder="Nombre">
                            <textarea id="skill1Desc" required placeholder="Descripción" rows="2"></textarea>
                            <input type="url" id="skill1Image" required placeholder="URL Imagen">
                        </div>
                        <div class="skill-box">
                            <h4>Habilidad 2</h4>
                            <input type="text" id="skill2Name" required placeholder="Nombre">
                            <textarea id="skill2Desc" required placeholder="Descripción" rows="2"></textarea>
                            <input type="url" id="skill2Image" required placeholder="URL Imagen">
                        </div>
                        <div class="skill-box">
                            <h4>Habilidad 3</h4>
                            <input type="text" id="skill3Name" required placeholder="Nombre">
                            <textarea id="skill3Desc" required placeholder="Descripción" rows="2"></textarea>
                            <input type="url" id="skill3Image" required placeholder="URL Imagen">
                        </div>
                        <div class="skill-box">
                            <h4>Habilidad 4 (Ultimate)</h4>
                            <input type="text" id="skill4Name" required placeholder="Nombre">
                            <textarea id="skill4Desc" required placeholder="Descripción" rows="2"></textarea>
                            <input type="url" id="skill4Image" required placeholder="URL Imagen">
                        </div>
                    </div>

                    <h3 class="section-title"><i class="fas fa-crosshairs"></i> Counters (Opcional)</h3>
                    <div class="counters-grid">
                        <input type="url" id="counter1" placeholder="URL Counter 1">
                        <input type="url" id="counter2" placeholder="URL Counter 2">
                        <input type="url" id="counter3" placeholder="URL Counter 3">
                        <input type="url" id="counter4" placeholder="URL Counter 4">
                        <input type="url" id="counter5" placeholder="URL Counter 5">
                        <input type="url" id="counter6" placeholder="URL Counter 6">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="fas fa-save"></i> Guardar Héroe
                        </button>
                        <button type="button" id="resetBtn" class="btn btn-secondary">
                            <i class="fas fa-redo"></i> Limpiar
                        </button>
                    </div>
                </form>
            </section>

            <section class="card list-card" id="heroes-list">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> Héroes Registrados</h2>
                    <span id="totalHeroes" class="badge">0</span>
                </div>
                <div id="recentList" class="hero-list"></div>
            </section>
        </div>
    </main>

    <div id="notification" class="notification">
        <span id="notificationText"></span>
        <button class="close-notification">&times;</button>
    </div>

    <script src="/admin-script.js"></script>
</body>
</html>
